name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libglx-mesa0 libxkbcommon-x11-0 \
            libdbus-1-3 libxcb-xinerama0 libxcb-cursor0

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Native C++ tests
        run: |
          pip install cmake
          cmake -S . -B build-native -DOPTICS_BUILD_MODULE=OFF -DOPTICS_BUILD_TESTS=ON
          cmake --build build-native --config Release --target optics_native_tests
          ctest --test-dir build-native -C Release --output-on-failure

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy optics rendering ui

      - name: Run tests
        run: pytest

  benchmarks:
    name: Benchmarks vs baseline (advisory)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Compare system matrix against checked-in baseline
        continue-on-error: true
        run: python benchmarks/check_baseline.py --advisory | Tee-Object baseline_report.txt

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-report
          path: baseline_report.txt
