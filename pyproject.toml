[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optics-simulator"
version = "0.1.0"
description = "3D geometric optics simulator with ray tracing and irradiance mapping"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.59",
    "PySide6>=6.5",
    "vispy>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
optics-simulator = "gui.app:main"

[tool.setuptools.packages.find]
include = ["optics*", "gui*"]
