[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optics-simulator"
version = "0.1.0"
description = "Interactive parametric ray-tracing optics simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "sympy",
    "vispy",
    "PySide6",
    "numba",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
opticssim = "ui.app:main"

[tool.setuptools.packages.find]
include = ["optics*", "rendering*", "ui*"]

[tool.setuptools.package-data]
ui = ["*.ui"]
"optics.examples" = ["*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"benchmarks/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["optics.*", "rendering.*", "ui.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
